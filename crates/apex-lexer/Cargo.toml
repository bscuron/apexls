[package]
name = "apex-lexer"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# SIMD-accelerated byte/substring search (the same crate ripgrep, regex,
# and this workspace's own `ignore` dependency use), for the "find the
# next comment/string delimiter" scanning hot paths.
memchr = "2.8.3"
# Compile-time perfect hash map for O(1), zero-allocation, collision-free
# keyword lookup (no runtime hashing/build step required).
phf = { version = "0.11", features = ["macros"] }

[dev-dependencies]
apex-discover.workspace = true
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "lexer_bench"
harness = false
