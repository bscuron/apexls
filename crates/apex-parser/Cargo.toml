[package]
name = "apex-parser"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
apex-lexer.workspace = true
apex-syntax.workspace = true
hotpath = "0.24.0"

[dev-dependencies]
apex-discover.workspace = true
apex-printer.workspace = true
criterion = { version = "0.8.2", features = ["html_reports"] }
insta = { version = "1.48.0", features = ["glob"] }
proptest = "1.11.0"
rayon = "1.12.0"

[[bench]]
name = "parser_bench"
harness = false

[features]
hotpath = ["hotpath/hotpath"]
hotpath-cpu = ["hotpath/hotpath-cpu"]
hotpath-alloc = ["hotpath/hotpath-alloc"]
