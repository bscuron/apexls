[package]
name = "apexls"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "apexls"
path = "src/main.rs"

[dependencies]
apex-binder.workspace = true
apex-discover.workspace = true
apex-parser.workspace = true
apex-printer.workspace = true
apexls-server.workspace = true
clap = { version = "4.6.6", features = ["derive"] }
rayon = "1.12.0"
tokio = { version = "1.27.0", features = ["rt"] }
